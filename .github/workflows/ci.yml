name: CI

# Pull requests, main after each merge, and main nightly. A branch needn't be up to date with main to
# merge (the owner's choice, 2026-10-21), so a green pull request merges at once, even after another
# has merged. After each merge, main runs the jobs that compile and unit-test everything, in a few
# minutes. It skips the end-to-end tests: they'd hold GitHub Free's 5 macOS slots for half an hour
# and delay the next pull request's run. The nightly run has them, so two pull requests that each
# passed alone are tested together within a day, and it catches changes to GitHub's runner images.
on:
  pull_request:
  push:
    branches: [main]
  # Runs the nightly's jobs by hand, after a runner image changes or to check a change to them.
  workflow_dispatch:
  schedule:
    # 10:17 UTC: about 3 AM in California, 2 AM in winter. Off the hour, which GitHub delays most.
    - cron: "17 10 * * *"

# By event too, so a merge doesn't cancel a nightly run that GitHub started late.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Linux jobs are cheap (1x minutes) and carry most of the testing.
  # Building the core on Linux also enforces ADR 0001: no Apple-only imports.
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Test PianismCore
        run: scripts/fail-on-warnings.sh swift test --package-path Packages/PianismCore

  lint:
    name: Format check
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: swift-format
        run: swift format lint --strict --recursive --parallel App AppUITests Widgets Packages

  # A pull request's run cancelled by a duplicate on the same commit (two `synchronize` events, #208) leaves its
  # required checks cancelled, and they block until that run is re-run (`gh run rerun <id>`: no push, so an approval
  # stays), once the other run has finished, as a re-run joins the concurrency group and would cancel it. If another
  # pull request run already passed on the same head commit, the re-run skips the Mac jobs, as a job skipped by its
  # `if:` counts as passing, and takes a couple of minutes, not an hour. So does any later run on that commit: to
  # re-test it, push a new commit. An API error means a full run; if this job itself fails, the Mac jobs are skipped
  # and the summary fails, so re-run the failed jobs.
  # A pull request that changes only Markdown files at the top level, in docs/ or in .claude/ skips the Mac jobs too,
  # as nothing built or tested reads those. Markdown anywhere else (say in App/, which Xcode copies into the app) runs
  # in full. The files come from the tested merge commit itself, with both names of a renamed file.
  passed:
    name: Look for an earlier pass or a docs-only change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      skip: ${{ steps.find.outputs.skip }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          n=0
          other=1
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=pull_request&status=success&head_sha=$SHA" \
              --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)] | length") || n=0
            # An error, or an empty list, counts as a file that isn't docs: a full run.
            files=$(git diff --no-renames --name-only HEAD^1 HEAD) || files=""
            other=$(printf '%s\n' "$files" | grep -cvE '^(docs/.*|\.claude/.*|[^/]*)\.md$') || true
            echo "Earlier passing runs on $SHA: $n. Changed files that aren't docs: ${other:-unknown}"
          fi
          echo "skip=$( { [ "$n" -gt 0 ] || [ "$other" -eq 0 ]; } && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Periphery reads the compiler's index, so it needs an Xcode build (ADR 0005).
  unused:
    name: Unused code (Periphery)
    needs: [core, lint, passed]
    if: needs.passed.outputs.skip != 'true'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest stable Xcode
        run: scripts/select-xcode.sh
      - name: Scan for unused code
        run: make unused

  # Adapters use Apple-only APIs such as NSFileCoordinator, so they are tested on macOS, against real
  # files. The view models live beside SwiftUI views, so they are tested here too. No simulator, so
  # this runs in a few minutes, alongside the end-to-end tests.
  adapters:
    name: Adapter integration tests (macOS)
    needs: [core, lint, passed]
    if: needs.passed.outputs.skip != 'true'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest stable Xcode
        run: scripts/select-xcode.sh
      - name: Test the adapter packages
        run: make test-adapters
      - name: Test the view models
        run: make test-features
      # The tests build Debug, so this catches code that only compiles there, such as preview helpers.
      # It runs here, without a simulator: next to a booting simulator it took 7 minutes, not 1.
      - name: Release build
        run: make build QUIET=

  # One job per device and iOS version, in parallel (`make test-app` builds, boots the simulator, then
  # tests). iOS 26 is the oldest the app supports. Only GitHub's `xcode-27` image, a preview, has
  # iOS 27, and the versions differ: an iOS 26 iPad hid a search field that iOS 27 shows. Booting in
  # the background during the build didn't help: on these 3-core runners it slowed the build as much
  # as it saved. The scheme has XCTest capture screenshots, not video: these runners have no hardware
  # video encoder, and while recording an iPad's screen the simulator's renderer grew to 3.7 GB of
  # their 7 GB and XCTest lost track of the app. This repository is public, so the runners cost
  # nothing; GitHub Free runs at most 5 macOS jobs at once, so of a pull request's 6, one waits a minute or
  # two for a short one to finish. The time limit allows for the `xcode-27` image's iPad, whose passing
  # jobs took 81 to 90 minutes by 2026-11-12, as the suite grew, plus a few retried tests and one hung
  # test's allowance (#136): at 90 minutes, a retry or two stopped it just short of the end.
  e2e:
    name: End-to-end tests (${{ matrix.device }}, iOS ${{ matrix.ios }})
    needs: [core, lint, passed]
    if: github.event_name != 'push' && needs.passed.outputs.skip != 'true'
    runs-on: ${{ matrix.ios == 26 && 'macos-26' || 'xcode-27' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
        ios: [26, 27]
        # Nightly and manual runs add a standard iPhone on 27.0: 27.1 runs only on the near-iPad-sized Duo.
        include: ${{ github.event_name != 'pull_request' && fromJSON('[{"device":"iPhone","ios":"27.0"}]') || fromJSON('[]') }}
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest stable Xcode
        run: scripts/select-xcode.sh
      - name: End-to-end tests
        # Nightly and manual runs also take the tests that lean on real time or a simulator service
        # (`UITestCase.skipUnlessSoaking`), which a pull request's run skips until they've passed nightly for a week.
        env:
          TEST_RUNNER_PIANISM_SOAKING: ${{ github.event_name != 'pull_request' && '1' || '' }}
        run: make test-app DEVICES=${{ matrix.device }} IOS=${{ matrix.ios }} QUIET=
      - name: Export screenshots
        if: always()
        run: make evidence DEVICES=${{ matrix.device }}
      - name: Upload screenshots (visual evidence for review)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.device }}-iOS${{ matrix.ios }}
          path: build/evidence
          retention-days: 14
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-xcresult-${{ matrix.device }}-iOS${{ matrix.ios }}
          path: build/results/*.xcresult
          retention-days: 7

  # Keeps the name of the required check, so the ruleset doesn't change.
  app:
    name: Build and end-to-end tests (iOS Simulator)
    needs: [passed, e2e]
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every device and iOS version passed, here or in an earlier run of this commit, or only docs changed
        run: test "${{ needs.e2e.result }}" = success || test "${{ needs.passed.outputs.skip }}" = true
