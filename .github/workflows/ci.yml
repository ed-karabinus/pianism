name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Linux jobs are cheap (1x minutes) and carry most of the testing.
  # Building the core on Linux also enforces ADR 0001: no Apple-only imports.
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Test PianismCore
        run: swift test --package-path Packages/PianismCore -Xswiftc -warnings-as-errors

  lint:
    name: Format check
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: swift-format
        run: swift format lint --strict --recursive --parallel App AppUITests Packages

  # macOS minutes cost 10x on private repos, so this job runs only after the cheap ones pass.
  app:
    name: Build and end-to-end tests (iOS Simulator)
    needs: [core, lint]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest stable Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Boot a simulator
        run: |
          udid=$(scripts/simulator-destination.sh | sed 's/.*id=//')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
      - name: Build and test
        run: make test-app
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-xcresult
          path: build/results/app.xcresult
          retention-days: 7
