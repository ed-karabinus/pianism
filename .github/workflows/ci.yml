name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Linux jobs are cheap (1x minutes) and carry most of the testing.
  # Building the core on Linux also enforces ADR 0001: no Apple-only imports.
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Test PianismCore
        run: scripts/fail-on-warnings.sh swift test --package-path Packages/PianismCore

  lint:
    name: Format check
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: swift-format
        run: swift format lint --strict --recursive --parallel App AppUITests Packages

  # Periphery reads the compiler's index, so it needs an Xcode build (ADR 0005).
  unused:
    name: Unused code (Periphery)
    needs: [core, lint]
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest stable Xcode
        run: scripts/select-xcode.sh
      - name: Scan for unused code
        run: make unused

  # Adapters use Apple-only APIs such as NSFileCoordinator, so they are tested on macOS, against real
  # files. No simulator, so this runs in a few minutes, alongside the end-to-end tests.
  adapters:
    name: Adapter integration tests (macOS)
    needs: [core, lint]
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest stable Xcode
        run: scripts/select-xcode.sh
      - name: Test the adapter packages
        run: make test-adapters
      # The tests build Debug, so this catches code that only compiles there, such as preview helpers.
      # It runs here, without a simulator: next to a booting simulator it took 7 minutes, not 1.
      - name: Release build
        run: make build QUIET=

  # One job per device, in parallel. Each starts booting its simulator, builds while it boots, then
  # tests (`make test-app`). This repository is public, so the runners cost nothing; GitHub Free
  # runs at most 5 macOS jobs at once, and a CI run uses 4.
  e2e:
    name: End-to-end tests (${{ matrix.device }})
    needs: [core, lint]
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest stable Xcode
        run: scripts/select-xcode.sh
      - name: Start booting the simulator
        run: |
          udid=$(scripts/simulator-destination.sh ${{ matrix.device }} | sed 's/.*id=//')
          xcrun simctl boot "$udid" > /dev/null 2>&1 &
      - name: End-to-end tests
        run: make test-app DEVICES=${{ matrix.device }} QUIET=
      - name: Export screenshots
        if: always()
        run: make evidence DEVICES=${{ matrix.device }}
      - name: Upload screenshots (visual evidence for review)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.device }}
          path: build/evidence
          retention-days: 14
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-xcresult-${{ matrix.device }}
          path: build/results/*.xcresult
          retention-days: 7

  # Keeps the name of the required check, so the ruleset doesn't change.
  app:
    name: Build and end-to-end tests (iOS Simulator)
    needs: [e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both devices passed
        run: test "${{ needs.e2e.result }}" = success
