name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Linux jobs are cheap (1x minutes) and carry most of the testing.
  # Building the core on Linux also enforces ADR 0001: no Apple-only imports.
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Test PianismCore
        run: swift test --package-path Packages/PianismCore

  lint:
    name: Format check
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: swift-format
        run: swift format lint --strict --recursive --parallel App AppUITests Packages

  # Adapters use Apple-only APIs such as NSFileCoordinator, so they are tested on macOS, against real
  # files. No simulator, so this runs in a few minutes, alongside the end-to-end tests.
  adapters:
    name: Adapter integration tests (macOS)
    needs: [core, lint]
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest stable Xcode
        run: scripts/select-xcode.sh
      - name: Test the adapter packages
        run: make test-adapters

  # Runs after the fast Linux jobs pass, so a formatting slip fails in one minute, not ten.
  app:
    name: Build and end-to-end tests (iOS Simulator)
    needs: [core, lint]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Select the newest stable Xcode
        run: scripts/select-xcode.sh
      # The tests build Debug, so this catches code that only compiles there, such as preview helpers.
      - name: Release build
        run: make build QUIET=
      # One simulator at a time: the runner is small, and separate steps keep a log and a time per device.
      - name: End-to-end tests on iPhone
        timeout-minutes: 20
        run: |
          udid=$(scripts/simulator-destination.sh iPhone | sed 's/.*id=//')
          xcrun simctl boot "$udid" && xcrun simctl bootstatus "$udid" -b
          make test-app DEVICES=iPhone QUIET=
          xcrun simctl shutdown "$udid"
      - name: End-to-end tests on iPad
        timeout-minutes: 20
        run: |
          udid=$(scripts/simulator-destination.sh iPad | sed 's/.*id=//')
          xcrun simctl boot "$udid" && xcrun simctl bootstatus "$udid" -b
          make test-app DEVICES=iPad QUIET=
      - name: Export screenshots
        if: always()
        run: make evidence
      - name: Upload screenshots (visual evidence for review)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/evidence
          retention-days: 14
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: app-xcresult
          path: build/results/*.xcresult
          retention-days: 7
